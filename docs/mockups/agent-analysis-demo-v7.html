<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI分析 Demo v7</title>
<style>
:root{--pri:#4ECDC4;--bg:#0d1117;--card:#161b22;--card2:#1a2540;--tx:#e6edf3;--tx2:#8b949e;--bd:#2a3550;--ok:#52c41a;--warn:#faad14;--danger:#ff4444;--bull:#FF4444;--bear:#00C853}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;padding:20px;max-width:1200px;margin:0 auto}
body.drawer-open{overflow:hidden}

.dc{background:linear-gradient(135deg,#1a2540,#16213E);border:1px solid var(--bd);border-radius:14px;padding:24px 28px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:12px}
.dc .name{font-size:20px;font-weight:700}.dc .code{font-size:13px;color:var(--tx2);margin-left:8px}
.dc .badge{display:inline-block;background:var(--warn);color:#1a1a2e;font-size:24px;font-weight:800;padding:4px 18px;border-radius:8px;margin-top:8px}
.dc .score{font-size:42px;font-weight:800;color:var(--warn)}.dc .sl{font-size:11px;color:var(--tx2)}
.pr{display:flex;gap:20px;margin-top:10px}.pi{text-align:center}.pi .l{font-size:10px;color:var(--tx2)}.pi .v{font-size:16px;font-weight:700}

.ph{display:flex;align-items:center;gap:10px;margin:32px 0 14px}
.pn{width:28px;height:28px;border-radius:50%;background:var(--pri);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.pt{font-size:15px;font-weight:700}.ps{font-size:11px;color:var(--tx2)}

.ar{display:flex;gap:14px;flex-wrap:wrap}
.ac{flex:1;min-width:320px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;display:flex;flex-direction:column;transition:border-color .2s}
.ac:hover{border-color:var(--pri)}
.ah{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ah img{width:52px;height:52px;border-radius:50%;border:2px solid var(--bd);flex-shrink:0}
.an{font-size:14px;font-weight:700}.ar2{font-size:11px;color:var(--tx2)}
.st{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;margin-left:auto}
.sdone{background:#1a3a2a;color:var(--ok)}.srun{background:#3a3218;color:var(--warn)}.swait{background:var(--card2);color:var(--tx2)}
.sc{font-size:22px;font-weight:800;margin-bottom:8px}
.sc small{font-size:11px;color:var(--tx2);font-weight:400;margin-left:4px}

.sect{font-size:11px;font-weight:700;color:var(--pri);margin:10px 0 6px;display:flex;align-items:center;gap:4px}
.sect::before{content:'';width:3px;height:12px;background:var(--pri);border-radius:2px}
.obs{list-style:none;padding:0}
.obs li{font-size:12px;padding:4px 0 4px 14px;position:relative;line-height:1.5}
.obs li::before{content:'▸';position:absolute;left:0;color:var(--pri)}

.rbar{height:8px;border-radius:4px;background:linear-gradient(90deg,#1a4a2a,#2a3540 50%,#4a1a2a);position:relative;margin:4px 8px 16px}
.rdot{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--tx);border:3px solid var(--bg);box-shadow:0 0 4px rgba(0,0,0,.3);transform:translateX(-50%)}
.rlbl{display:flex;justify-content:space-between;font-size:10px;color:var(--tx2);margin:0 8px}
.rlbl .rv{font-weight:700;color:var(--tx)}.rlbl .rs{color:var(--ok)}.rlbl .rr{color:var(--danger)}

.prow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:11px}
.prow .pl{width:50px;flex-shrink:0;color:var(--tx2);text-align:right}
.pbar{flex:1;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.pfill{height:100%;border-radius:3px}
.prow .pv{color:var(--tx2);font-size:10px;white-space:nowrap}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;background:var(--card2);font-size:11px;border:1px solid var(--bd)}
.chip .cl{color:var(--tx2);font-size:10px}.chip .cv{font-weight:600}
.cv.good{color:var(--ok)}.cv.bad{color:var(--danger)}.cv.warn{color:var(--warn)}

.more{font-size:10px;color:var(--tx2);margin:4px 0;font-style:italic}
.vbtn{display:block;width:100%;margin-top:auto;padding:8px;background:transparent;border:1px solid var(--pri);border-radius:8px;color:var(--pri);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:background .2s;flex-shrink:0}
.vbtn:hover{background:rgba(78,205,196,.1)}

.cn{display:flex;justify-content:center;padding:8px 0}
.cn .ln{width:1px;height:20px;background:var(--bd);position:relative}
.cn .ln::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top:6px solid var(--bd)}

.chat{max-width:700px;margin:0 auto}
.bub{max-width:78%;padding:10px 14px;border-radius:14px;margin:6px 0;font-size:12px;line-height:1.5}
.bub-bull{background:#2d1a1a;border:1px solid #5a2a2a;border-bottom-left-radius:4px;margin-right:auto}
.bub-bear{background:#1a2d1a;border:1px solid #2a5a2a;border-bottom-right-radius:4px;margin-left:auto}
.bub .who{font-size:10px;font-weight:700;margin-bottom:3px}
.bub-bull .who{color:#ff6b6b}.bub-bear .who{color:#4ade80}
.rtag{text-align:center;font-size:10px;color:var(--tx2);margin:10px 0;background:var(--card);border-radius:10px;padding:2px 12px;display:inline-block}
.rtw{text-align:center}
.brow{display:flex;gap:8px;align-items:flex-start}
.brow.right{justify-content:flex-end}
.brow img{width:32px;height:32px;border-radius:50%;flex-shrink:0}
.ref{display:inline-block;font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.08);color:var(--tx2);margin:0 2px}

.rk3{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.rk{flex:1;min-width:180px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center}
.rk img{width:40px;height:40px;border-radius:50%;margin-bottom:4px}
.rk .rn{font-size:11px;font-weight:700;margin-bottom:4px}
.rk .rv{font-size:10px;color:var(--tx2);text-align:left;padding:6px;background:var(--card2);border-radius:6px;line-height:1.5}

.tc{background:linear-gradient(135deg,#1a2d2a,#162435);border:2px solid var(--pri);border-radius:12px;padding:20px;margin-top:6px}
.th{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.th img{width:64px;height:64px;border-radius:50%;border:2px solid var(--pri)}
.tm{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.mb{background:var(--card);border-radius:8px;padding:8px 12px;text-align:center}
.mb .l{font-size:10px;color:var(--tx2)}.mb .v{font-size:16px;font-weight:700;color:var(--pri)}

/* 抽屉 */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:999}
.dwr{position:fixed;top:0;right:0;width:55%;max-width:700px;height:100vh;background:var(--bg);border-left:1px solid var(--bd);transform:translateX(100%);transition:transform .3s ease;z-index:1000;display:flex;flex-direction:column}
.dwr.open{transform:translateX(0)}.ovl.open{opacity:1;pointer-events:auto}
@media(max-width:768px){.dwr{width:100%}}
.dhd{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--bd);flex-shrink:0}
.dhd img{width:36px;height:36px;border-radius:50%}
.dcls{margin-left:auto;background:none;border:none;color:var(--tx2);font-size:24px;cursor:pointer;padding:4px 12px;border-radius:6px}
.dcls:hover{background:var(--card);color:var(--tx)}
.dtb{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto;scrollbar-width:thin}
.dtb::-webkit-scrollbar{height:4px}.dtb::-webkit-scrollbar-thumb{background:var(--bd)}
.dtab{padding:10px 14px;font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0}
.dtab.active{color:var(--pri);border-bottom-color:var(--pri)}
.dtb-w{position:relative;flex-shrink:0}
.dtb-w::after{content:'';position:absolute;right:0;top:0;bottom:0;width:30px;background:linear-gradient(90deg,transparent,var(--bg));pointer-events:none}
.dbody{flex:1;overflow-y:auto;padding:20px}
.dbody::-webkit-scrollbar{width:6px}.dbody::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.rpt{font-size:13px;line-height:1.8;color:var(--tx)}
.rpt h2{font-size:16px;color:var(--pri);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.rpt h3{font-size:14px;color:var(--pri);margin:12px 0 6px}
.rpt p{margin:6px 0}
.rpt ul{padding-left:20px;margin:6px 0}
.rpt li{margin:3px 0}
.rpt strong{color:var(--pri)}
.rpt table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px}
.rpt th{background:var(--card2);padding:6px 8px;text-align:left;border:1px solid var(--bd);color:var(--tx)}
.rpt td{padding:6px 8px;border:1px solid var(--bd);color:var(--tx2)}
.rpt hr{border:none;border-top:1px solid var(--bd);margin:12px 0}
.rpt .full-text{background:var(--card);border-radius:8px;padding:12px;font-size:12px;line-height:1.8;white-space:pre-wrap;color:var(--tx)}

/* 全字段网格 */
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin:10px 0}
.fc{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px}
.fc .fk{font-size:9px;font-weight:700;color:var(--tx2);text-transform:uppercase;margin-bottom:2px}
.fc .fv{font-size:12px;font-weight:600;word-break:break-word}
.fv.good{color:var(--ok)}.fv.bad{color:var(--danger)}.fv.warn{color:var(--warn)}
.fc .fs{font-size:10px;color:var(--tx2)}
.fgt{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--pri);margin-top:8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}

/* 数组列表 */
.alist{list-style:none;padding:0;margin:6px 0}
.alist li{font-size:12px;padding:4px 0 4px 14px;position:relative;line-height:1.5;border-bottom:1px solid rgba(255,255,255,.03)}
.alist li::before{content:'▸';position:absolute;left:0;color:var(--pri)}

/* 实时进度 */
.prog-overlay{position:fixed;inset:0;background:rgba(13,17,23,.95);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.prog-overlay.show{opacity:1;pointer-events:auto}
.prog-box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:32px 40px;max-width:500px;width:90%}
.prog-title{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center}
.prog-bar-w{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin-bottom:20px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--pri),#4ECDC4);border-radius:4px;transition:width .5s ease}
.prog-agents{display:flex;flex-direction:column;gap:8px}
.pa{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card2);border-radius:8px;border:1px solid var(--bd)}
.pa img{width:32px;height:32px;border-radius:50%;flex-shrink:0}
.pa .pn2{font-size:12px;font-weight:600;flex:1}
.pa .ps2{font-size:11px;font-weight:600}
.ps2.done{color:var(--ok)}.ps2.run{color:var(--warn)}.ps2.wait{color:var(--tx2)}
.pa .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.done{background:var(--ok)}.dot.run{background:var(--warn);animation:pulse 1s infinite}.dot.wait{background:var(--bd)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.prog-close{margin-top:16px;width:100%;padding:8px;background:transparent;border:1px solid var(--pri);border-radius:8px;color:var(--pri);font-size:13px;cursor:pointer;display:none}
.prog-close.show{display:block}

/* Replay 按钮 */
.replay-btn{position:fixed;bottom:20px;right:20px;z-index:998;padding:8px 16px;background:var(--card);border:1px solid var(--pri);border-radius:20px;color:var(--pri);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .2s}
.replay-btn:hover{background:rgba(78,205,196,.1)}

/* 错误提示 */
.err-box{background:#2d1a1a;border:1px solid #5a2a2a;border-radius:10px;padding:16px;margin:20px 0;text-align:center}
.err-box .et{color:var(--danger);font-weight:700;margin-bottom:8px}
.err-box .es{color:var(--tx2);font-size:12px}
</style>
</head>
<body>

<!-- 实时进度弹窗 -->
<div class="prog-overlay" id="prog-ovl">
  <div class="prog-box">
    <div class="prog-title">🤖 AI 团队正在分析 <span id="prog-stock">工商银行</span></div>
    <div class="prog-bar-w"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="prog-agents" id="prog-agents"></div>
    <div style="text-align:center;margin-top:12px;font-size:11px;color:var(--tx2)" id="prog-status">准备中...</div>
    <button class="prog-close" id="prog-close" onclick="skipProgress()">跳过动画，直接看结果</button>
  </div>
</div>

<!-- 主页面 -->
<div class="dc" id="decision-card" style="display:none"></div>
<div id="main-content" style="display:none">
  <div class="ph"><div class="pn">1</div><div><div class="pt">分析师团队</div><div class="ps">三面并行</div></div></div>
  <div class="ar" id="analysts-row"></div>
  <div class="cn"><div class="ln"></div></div>
  <div class="ph"><div class="pn">2</div><div><div class="pt">多空辩论</div><div class="ps">2 轮对抗</div></div></div>
  <div class="chat" id="debate-view"></div>
  <div class="cn"><div class="ln"></div></div>
  <div class="ph"><div class="pn">3</div><div><div class="pt">研究经理评判</div></div></div>
  <div class="ar"><div class="ac" style="max-width:600px" id="rm-card"></div></div>
  <div class="cn"><div class="ln"></div></div>
  <div class="ph"><div class="pn">4-5</div><div><div class="pt">风险辩论 + 风险经理</div></div></div>
  <div class="rk3" id="risk3"></div>
  <div class="ar"><div class="ac" style="max-width:600px" id="riskmgr-card"></div></div>
  <div class="cn"><div class="ln"></div></div>
  <div class="ph"><div class="pn">6</div><div><div class="pt">交易员最终决策</div></div></div>
  <div class="tc" id="trader-card"></div>
</div>

<!-- 重播按钮 -->
<button class="replay-btn" id="replay-btn" style="display:none" onclick="replay()">▶ 重播分析过程</button>

<!-- 抽屉 -->
<div class="ovl" id="ovl" onclick="closeDrawer()"></div>
<div class="dwr" id="dwr">
  <div class="dhd"><img id="dwr-av"><div><div style="font-size:15px;font-weight:700" id="dwr-tt"></div><div style="font-size:10px;color:var(--tx2" id="dwr-st"></div></div><button class="dcls" onclick="closeDrawer()">×</button></div>
  <div class="dtb" id="dwr-tabs"></div>
  <div class="dbody rpt" id="dwr-body"></div>
</div>

<script>
let D=null, progressTimer=null;

// ===== 工具函数 =====
// 枚举值 → 中文
const CN = {
  bull:'看多', base:'基准', bear:'看空', bullish:'看涨', bearish:'看跌', neutral:'中性',

// 字段名 → 中文（覆盖全部 tech/fund/news/combined/trader 字段）
const KEY_CN = {

  insider_signal:'内部人信号', insider_note:'内部人详情', pledge_risk:'质押风险', pledge_note:'质押详情',

function cn(v){ return (typeof v==='string') ? (CN[v.toLowerCase()] || v) : v; }
function kcn(k){ return KEY_CN[k] || k; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function get(obj, path) {
  return path.split('.').reduce((o,k) => (o&&o[k]!==undefined)?o[k]:undefined, obj);
}

function fmt(v) {
  if (v===null||v===undefined) return 'null';
  if (typeof v==='number') return Number.isInteger(v)?v.toLocaleString():v.toFixed(2);
  if (typeof v==='boolean') return v?'是':'否';
  if (typeof v==='string') return v.length>120 ? v.slice(0,118)+'…' : v;
  if (Array.isArray(v)) return null; // handled separately
  if (typeof v==='object') return null; // handled separately
  return String(v);
}

function colorFor(key, val) {
  const s = String(val).toLowerCase();
  if (/growth|yoy|upside/.test(key)) return parseFloat(s)>0?'good':'bad';
  if (/debt|ratio.*risk|pledge/.test(key)) return parseFloat(s)>50?'warn':'good';
  if (/score/.test(key)) return parseFloat(s)>=60?'good':parseFloat(s)>=40?'warn':'bad';
  if (/signal/.test(key)) return /death|bear|sell|negative/.test(s)?'bad':/golden|bull|buy/.test(s)?'good':'';
  if (/insider|sentiment/.test(key)) return /buy|positive/.test(s)?'good':/sell|negative/.test(s)?'bad':'warn';
  return '';
}

// ===== 全字段自动渲染 =====
function fieldGridAuto(json, groups) {
  const keys = Object.keys(json);
  let h = '<div class="fg">';
  const grouped = {};

  for (const k of keys) {
    const v = json[k];
    if (v===null||v===undefined||v==='') continue;
    let found = false;
    if (groups) {
      for (const [gname, pattern] of Object.entries(groups)) {
        if (pattern.test(k)) { (grouped[gname]=grouped[gname]||[]).push([k,v]); found=true; break; }
      }
    }
    if (!found) (grouped['其他']=grouped['其他']||[]).push([k,v]);
  }

  for (const [gname, fields] of Object.entries(grouped)) {
    h += `<div class="fgt">${gname}</div>`;
    for (const [k,v] of fields) {
      if (Array.isArray(v)) {
        // 数组 → 列表
        h += `<div style="grid-column:1/-1" class="fc"><div class="fk">${kcn(k)}</div><ul class="alist">`;
        v.slice(0,5).forEach(item => {
          const txt = typeof item==='object' ? (item.event||item.title||item.condition||JSON.stringify(item).slice(0,80)) : cn(item);
          h += `<li>${esc(String(txt))}</li>`;
        });
        if (v.length>5) h += `<li style="color:var(--tx2)">… 共 ${v.length} 条</li>`;
        h += '</ul></div>';
      } else if (typeof v==='object') {
        // 对象 → 子字段（标签：父字段中文·子字段中文）
        for (const [sk,sv] of Object.entries(v)) {
          const fv2 = fmt(sv);
          if (fv2===null && typeof sv==='object') {
            h += `<div class="fc"><div class="fk">${kcn(k)}·${kcn(sk)}</div><div class="fs">${esc(JSON.stringify(sv).slice(0,80))}…</div></div>`;
          } else if (fv2!==null) {
            h += `<div class="fc"><div class="fk">${kcn(k)}·${kcn(sk)}</div><div class="fv ${colorFor(sk,sv)}">${esc(typeof sv==='string'?cn(fv2):fv2)}</div></div>`;
          }
        }
      } else {
        h += `<div class="fc"><div class="fk">${kcn(k)}</div><div class="fv ${colorFor(k,v)}">${esc(typeof v==='string'?cn(fmt(v)):fmt(v))}</div></div>`;
      }
    }
  }
  return h + '</div>';
}

// ===== Markdown 渲染 =====
function md(src) {
  if (!src) return '<p style="color:var(--tx2)">（无内容）</p>';
  let lines = src.split('\n');
  let h = [], inList = false, inTable = false;

  for (let line of lines) {
    let trimmed = line.trim();
    if (!trimmed) { if(inList){h.push('</ul>');inList=false;} if(inTable){h.push('</table>');inTable=false;} continue; }

    // Table row
    if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
      const cells = trimmed.slice(1,-1).split('|').map(c=>c.trim());
      if (cells.every(c=>/^[-: ]+$/.test(c))) continue; // separator
      if (!inTable) { h.push('<table>'); inTable=true; }
      h.push('<tr>' + cells.map(c=>`<td>${c.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}</td>`).join('') + '</tr>');
      continue;
    } else if (inTable) { h.push('</table>'); inTable=false; }

    // Heading
    let m = trimmed.match(/^(#{1,4})\s+(.+)$/);
    if (m) {
      if(inList){h.push('</ul>');inList=false;}
      const lv = m[1].length;
      const tag = lv<=2?'h2':lv===3?'h3':'h4';
      h.push(`<${tag}>${m[2].replace(/\*\*/g,'')}</${tag}>`);
      continue;
    }

    // HR
    if (/^---+$/.test(trimmed)) { h.push('<hr>'); continue; }

    // List item
    m = trimmed.match(/^[-*]\s+(.+)$/) || trimmed.match(/^\d+\.\s+(.+)$/);
    if (m) {
      if(!inList){h.push('<ul>');inList=true;}
      h.push(`<li>${m[1].replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}</li>`);
      continue;
    }

    if(inList){h.push('</ul>');inList=false;}

    // Paragraph
    h.push(`<p>${esc(trimmed).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}</p>`);
  }
  if(inList)h.push('</ul>'); if(inTable)h.push('</table>');
  return h.join('');
}

function refs(t){ return t.replace(/\[(.+?)\]/g,'<span class="ref">$1</span>'); }

    <div><div style="font-size:22px;font-weight:800">${c.risk_score}</div><div style="font-size:10px;color:var(--tx2)">评分</div></div>
  </div>
  ${c.key_risks?`<div class="sect">核心风险</div><ul class="obs">${c.key_risks.slice(0,3).map(k=>`<li>${k}</li>`).join('')}</ul>${c.key_risks.length>3?`<div class="more">+${c.key_risks.length-3} 条更多</div>`:''}`:''}`;

  document.getElementById('trader-card').innerHTML=`
  <div class="th"><img src="avatars/trader.svg"><div><div style="font-size:16px;font-weight:700">交易员</div><div style="font-size:11px;color:var(--tx2)">最终决策 · ${m.duration_s}s</div></div></div>
  <div class="tm">
    <div class="mb"><div class="l">决策</div><div class="v">${cn(t.action)}</div></div>
    <div class="mb"><div class="l">目标价</div><div class="v">${t.target_price}</div></div>
    <div class="mb"><div class="l">止损</div><div class="v">${t.stop_loss}</div></div>
    <div class="mb"><div class="l">置信度</div><div class="v">${t.confidence_total}</div></div>
    <div class="mb"><div class="l">仓位</div><div class="v">${t.position_range}</div></div>
    <div class="mb"><div class="l">时间</div><div class="v">${t.time_horizon}</div></div>
  </div>
  <div class="sect">决策推理</div><p style="font-size:12px;margin:6px 0">${t.reasoning}</p>
  ${t.take_profit_levels?`<div class="sect">分批止盈</div><div style="display:flex;gap:6px;margin:6px 0">${t.take_profit_levels.map(tp=>`<div style="flex:1;background:var(--card);border-radius:6px;padding:6px;text-align:center;border:1px solid var(--bd)"><div style="font-size:10px;color:var(--tx2)">目标</div><div style="font-size:14px;font-weight:700;color:var(--ok)">${tp.price}</div><div style="font-size:10px;color:var(--tx2)">减${tp.portion}%</div></div>`).join('')}</div>`:''}
  ${t.entry_conditions?`<div class="sect">入场条件</div><ul class="obs">${t.entry_conditions.map(e=>`<li>${e}</li>`).join('')}</ul>`:''}
  ${t.key_catalysts?`<div class="sect">催化剂</div><ul class="obs">${t.key_catalysts.map(k=>`<li>${k}</li>`).join('')}</ul>`:''}
  <button class="vbtn" onclick="openDrawer('trader')">查看完整决策（${Object.keys(t).length} 字段）→</button>`;

  document.getElementById('main-content').style.display='block';
  document.getElementById('replay-btn').style.display='flex';
}

// ===== 实时进度模拟 =====
const AGENT_SEQUENCE = [
  {id:'tech', name:'技术分析师', icon:'avatars/tech.svg', desc:'分析K线/指标/资金流'},
  {id:'fund', name:'基本面分析师', icon:'avatars/fund.svg', desc:'分析财务/估值/DCF'},
  {id:'news', name:'新闻分析师', icon:'avatars/news.svg', desc:'分析新闻/公告/舆情'},
  {id:'bull', name:'看多辩手', icon:'avatars/bull.svg', desc:'构建看多论点'},
  {id:'bear', name:'看空辩手', icon:'avatars/bear.svg', desc:'构建看空论点'},
  {id:'rm', name:'研究经理', icon:'avatars/rm.svg', desc:'评判辩论胜负'},
  {id:'risk', name:'风险辩论', icon:'avatars/riskmgr.svg', desc:'三方风险评估'},
  {id:'trader', name:'交易员', icon:'avatars/trader.svg', desc:'输出最终决策'},
];

function showProgress() {
  const el=document.getElementById('prog-agents');
  el.innerHTML=AGENT_SEQUENCE.map(a=>`
  <div class="pa" id="pa-${a.id}">
    <img src="${a.icon}">
    <div><div class="pn2">${a.name}</div><div style="font-size:9px;color:var(--tx2)">${a.desc}</div></div>
    <div class="dot wait" id="dot-${a.id}"></div>
    <span class="ps2 wait" id="ps-${a.id}">等待</span>
  </div>`).join('');
  document.getElementById('prog-ovl').classList.add('show');
  document.getElementById('prog-close').classList.add('show');

  const delays=[500,1000,1500,2500,3200,4200,4800,5600];
  let total=8;

  AGENT_SEQUENCE.forEach((a,i)=>{
    setTimeout(()=>{
      updateAgent(a.id,'run');
      updateProgress((i)/total*100,`${a.name} 正在分析...`);
    },delays[i]);

    setTimeout(()=>{
      updateAgent(a.id,'done');
      updateProgress((i+1)/total*100,`${a.name} 完成`);
      if(i===total-1){
        setTimeout(()=>{
          document.getElementById('prog-ovl').classList.remove('show');
          renderMain();
        },800);
      }
    },delays[i]+800);
  });
}

function updateAgent(id,status){
  const dot=document.getElementById(`dot-${id}`);
  const ps=document.getElementById(`ps-${id}`);
  if(!dot||!ps)return;
  dot.className=`dot ${status}`;
  ps.className=`ps2 ${status}`;
  ps.textContent=status==='done'?'✓ 完成':status==='run'?'● 执行中':'等待';
}

function updateProgress(pct,status){
  document.getElementById('prog-fill').style.width=`${pct}%`;
  document.getElementById('prog-status').textContent=status;
}

function skipProgress(){
  if(progressTimer)clearTimeout(progressTimer);
  document.getElementById('prog-ovl').classList.remove('show');
  renderMain();
}

function replay(){ showProgress(); }

// ===== 抽屉 =====
const TABS={
  overview:{icon:'avatars/rm.svg',title:'总览'},
  tech:{icon:'avatars/tech.svg',title:'技术面'},
  fund:{icon:'avatars/fund.svg',title:'基本面'},
  news:{icon:'avatars/news.svg',title:'新闻面'},
  debate:{icon:'avatars/bull.svg',title:'辩论'},
  risk:{icon:'avatars/riskmgr.svg',title:'风险'},
  trader:{icon:'avatars/trader.svg',title:'决策'},
};
const TAB_ORDER=['overview','tech','fund','news','debate','risk','trader'];

function openDrawer(tab){
  document.getElementById('dwr-tabs').innerHTML=TAB_ORDER.map(t=>
    `<div class="dtab ${t===tab?'active':''}" onclick="switchTab('${t}')">${TABS[t].title}</div>`).join('');
  switchTab(tab);
  document.getElementById('dwr').classList.add('open');
  document.getElementById('ovl').classList.add('open');
  document.body.classList.add('drawer-open');
}
function switchTab(tab){
  document.querySelectorAll('.dtab').forEach(el=>el.classList.toggle('active',el.textContent===TABS[tab].title));
  document.getElementById('dwr-av').src=TABS[tab].icon;
  document.getElementById('dwr-tt').textContent=`${TABS[tab].title} · ${D.meta.stock_name}`;
  document.getElementById('dwr-body').innerHTML=renderTab(tab);
  document.getElementById('dwr-body').scrollTop=0;
}
function closeDrawer(){
  document.getElementById('dwr').classList.remove('open');
  document.getElementById('ovl').classList.remove('open');
  document.body.classList.remove('drawer-open');
}

function renderTab(tab){
  const c=D.combined,t=D.trader;
  try{
    switch(tab){
      case 'overview':return `<h2>综合研判</h2>${fieldGridAuto(c)}<h2>决策摘要</h2>${fieldGridAuto(t,{ '核心决策':/action|strength/, '价格':/price|loss|profit/, '置信与风险':/confidence|risk|position/, '时间与推理':/time|reason|warning|catalyst|entry|summary|fresh/ })}`;
      case 'tech':{const j=D.tech.json;return `<h2>技术面报告</h2><h3>分析推理</h3><div class="full-text">${D.tech.content||'（无）'}</div><h3>全部 ${Object.keys(j).length} 字段</h3>${fieldGridAuto(j,GROUPS.tech)}`;}
      case 'fund':{const j=D.fund.json;return `<h2>基本面报告</h2><h3>分析推理</h3><div class="full-text">${D.fund.content||'（无）'}</div><h3>全部 ${Object.keys(j).length} 字段</h3>${fieldGridAuto(j,GROUPS.fund)}`;}
      case 'news':return `<h2>新闻面报告</h2><h3>完整报告（markdown）</h3>${md(D.news.content)}<h3>全部 ${Object.keys(D.news.json).length} 字段</h3>${fieldGridAuto(D.news.json,GROUPS.news)}`;
      case 'debate':{let h='<h2>多空辩论</h2>';for(const r of(D.debate.rounds||[])){h+=`<h3>第 ${r.round} 轮</h3>`;if(r.bull)h+=`<div style="background:#2d1a1a;border-radius:8px;padding:12px;margin:6px 0;border-left:3px solid #FF4444"><b style="color:#ff6b6b">🐂 看多</b><br>${refs(r.bull.content||'')}</div>`;if(r.bear)h+=`<div style="background:#1a2d1a;border-radius:8px;padding:12px;margin:6px 0;border-left:3px solid #00C853"><b style="color:#4ade80">🐻 看空</b><br>${refs(r.bear.content||'')}</div>`;}return h;}
      case 'risk':{let h=`<h2>风险辩论 + 风险经理</h2>${fieldGridAuto(c,{ '风险等级':/risk_level|risk_score|risk_winner|position_sug|stop_loss/, '风险提示':/key_risk|risk_warning|key_opp/ })}`;const r=D.risk.rounds?.[0]||{};if(r.aggressive)h+=`<h3>🔥 激进方</h3><div style="background:#2d1a1a;border-radius:8px;padding:10px">${refs(r.aggressive.content||'')}</div>`;if(r.neutral)h+=`<h3>⚖️ 中性方</h3><div style="background:var(--card);border-radius:8px;padding:10px">${refs(r.neutral.content||'')}</div>`;if(r.conservative)h+=`<h3>🛡️ 保守方</h3><div style="background:#1a2d1a;border-radius:8px;padding:10px">${refs(r.conservative.content||'')}</div>`;return h;}
      case 'trader':{let h=`<h2>交易决策</h2>${fieldGridAuto(t,{ '决策':/action|strength/, '价格':/price|loss|profit/, '置信':/confidence/, '风险与仓位':/risk|position/, '时间':/time|horizon/, '理由':/rationale|reason|summary/ })}`;if(t.confidence_components){h+='<h3>置信度 5 维</h3>';const labels={signal_consistency:'信号一致',data_sufficiency:'数据充分',debate_certainty:'辩论确定',risk_controllability:'风控可控',valuation_reasonableness:'估值合理'};const colors=['#4C6EF5','#2F9E44','#F59F00','#E8590C','#9C36B5'];let i=0;for(const[k,v]of Object.entries(t.confidence_components)){h+=`<div class="prow"><span class="pl">${labels[k]||k}</span><div class="pbar"><div class="pfill" style="width:${v/20*100}%;background:${colors[i%colors.length]}"></div></div><span class="pv">${v}/20</span></div>`;i++;}}return h;}
    }
  }catch(e){return `<div class="err-box"><div class="et">渲染出错</div><div class="es">${e.message}</div></div>`;}
  return '';
}

// ===== 启动 =====
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

fetch('result_data.json')
  .then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()})
  .then(d=>{D=d;showProgress()})
  .catch(e=>{
    document.body.innerHTML=`<div class="err-box"><div class="et">⚠ 数据加载失败</div><div class="es">${e.message}</div><div class="es" style="margin-top:8px">请用 Live Server 或 python -m http.server 打开，不要直接双击 HTML 文件。</div></div>`;
  });
</script>
