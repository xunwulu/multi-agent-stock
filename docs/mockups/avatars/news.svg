  <circle cx="100" cy="34" r="6" fill="#E0761B"/>

  <!-- eyes -->
  <ellipse cx="76" cy="108" rx="11" ry="13" fill="#3B2B20"/>
  <circle cx="80" cy="103" r="4" fill="#FFFFFF"/>
  <circle cx="73" cy="112" r="2" fill="#FFFFFF"/>
  <ellipse cx="124" cy="108" rx="11" ry="13" fill="#3B2B20"/>
  <circle cx="128" cy="103" r="4" fill="#FFFFFF"/>
  <circle cx="121" cy="112" r="2" fill="#FFFFFF"/>

  <!-- eyebrows (curious) -->
  <path d="M66 88 Q76 83 86 87" fill="none" stroke="#8A5535" stroke-width="4" stroke-linecap="round"/>
  <path d="M114 84 Q124 80 134 85" fill="none" stroke="#8A5535" stroke-width="4" stroke-linecap="round"/>

  <!-- muzzle -->
  <ellipse cx="100" cy="145" rx="34" ry="24" fill="#F3C99A"/>
  <ellipse cx="89" cy="145" rx="6" ry="8" fill="#8A5535"/>
  <ellipse cx="111" cy="145" rx="6" ry="8" fill="#8A5535"/>
  <path d="M92 158 Q100 163 108 158" fill="none" stroke="#8A5535" stroke-width="3" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="55" cy="130" rx="8" ry="5" fill="#F2A98A" opacity="0.7"/>
  <ellipse cx="145" cy="130" rx="8" ry="5" fill="#F2A98A" opacity="0.7"/>
