  <ellipse cx="30" cy="95" rx="11" ry="7" fill="#E8A87C" transform="rotate(-20 30 95)"/>
  <ellipse cx="170" cy="95" rx="20" ry="14" fill="#B57A4E" transform="rotate(20 170 95)"/>
  <ellipse cx="170" cy="95" rx="11" ry="7" fill="#E8A87C" transform="rotate(20 170 95)"/>

  <!-- horns -->
  <path d="M55 40 Q45 15 68 20 Q80 23 82 42 Q70 34 55 40Z" fill="#F5E3C0"/>
  <path d="M145 40 Q155 15 132 20 Q120 23 118 42 Q130 34 145 40Z" fill="#F5E3C0"/>

