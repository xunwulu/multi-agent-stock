<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- background circle -->
  <circle cx="100" cy="100" r="96" fill="#F4EDF7"/>
  <!-- ears -->
  <ellipse cx="30" cy="88" rx="16" ry="11" fill="#9C89A6"/>
  <ellipse cx="30" cy="88" rx="9" ry="6" fill="#B7A6C0"/>
  <ellipse cx="170" cy="88" rx="16" ry="11" fill="#9C89A6"/>
  <ellipse cx="170" cy="88" rx="9" ry="6" fill="#B7A6C0"/>
  <!-- horns -->
  <path d="M62 52 Q50 34 62 24 Q72 34 74 50 Z" fill="#E8C88F"/>
  <path d="M138 52 Q150 34 138 24 Q128 34 126 50 Z" fill="#E8C88F"/>
  <!-- crown -->
  <path d="M84 24 L92 8 L100 20 L108 8 L116 24 Z" fill="#F5C542"/>
  <rect x="83" y="24" width="34" height="5" rx="2.5" fill="#E0AE2E"/>
  <circle cx="100" cy="15" r="2.5" fill="#FFF3C4"/>
  <!-- head -->
  <ellipse cx="100" cy="112" rx="62" ry="58" fill="#9C89A6"/>
  <!-- forelock tuft -->
  <path d="M88 58 Q100 48 112 58 Q106 66 100 62 Q94 66 88 58 Z" fill="#847294"/>
  <!-- eye whites -->
  <ellipse cx="76" cy="104" rx="17" ry="19" fill="#FFFFFF"/>
  <ellipse cx="124" cy="104" rx="17" ry="19" fill="#FFFFFF"/>
  <!-- eyes looking up (thoughtful) -->
  <circle cx="78" cy="97" r="9" fill="#3A2E42"/>
  <circle cx="122" cy="97" r="9" fill="#3A2E42"/>
  <circle cx="81" cy="94" r="3" fill="#FFFFFF"/>
  <circle cx="125" cy="94" r="3" fill="#FFFFFF"/>
  <!-- eyebrows raised -->
  <path d="M64 80 Q76 74 88 80" stroke="#6E5C80" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M112 80 Q124 74 136 80" stroke="#6E5C80" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- muzzle -->
  <ellipse cx="100" cy="142" rx="34" ry="24" fill="#B7A6C0"/>
  <ellipse cx="90" cy="142" rx="6" ry="8" fill="#6E5C80"/>
  <ellipse cx="110" cy="142" rx="6" ry="8" fill="#6E5C80"/>
  <!-- subtle smile -->
  <path d="M92 154 Q100 160 108 154" stroke="#6E5C80" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="54" cy="126" rx="9" ry="5" fill="#C79BA8" opacity="0.6"/>
  <ellipse cx="146" cy="126" rx="9" ry="5" fill="#C79BA8" opacity="0.6"/>
  <!-- thought bubble -->
  <circle cx="158" cy="34" r="4" fill="#FFFFFF"/>
  <circle cx="170" cy="22" r="6" fill="#FFFFFF"/>
  <circle cx="184" cy="8" r="9" fill="#FFFFFF"/>
  <text x="184" y="12" font-family="Arial, sans-serif" font-size="10" fill="#9C89A6" text-anchor="middle">?</text>
</svg>