  <circle cx="82" cy="107" r="8" fill="#3E2723"/>
  <circle cx="122" cy="107" r="8" fill="#3E2723"/>
  <circle cx="85" cy="103" r="3" fill="#FFFFFF"/>
  <circle cx="125" cy="103" r="3" fill="#FFFFFF"/>
  <circle cx="79" cy="111" r="1.5" fill="#FFFFFF"/>
