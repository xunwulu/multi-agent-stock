  <path d="M40 55 L43 62 L50 65 L43 68 L40 75 L37 68 L30 65 L37 62 Z" fill="#FFC107"/>
  <path d="M160 60 L163 67 L170 70 L163 73 L160 80 L157 73 L150 70 L157 67 Z" fill="#FFC107"/>
