  <path d="M58 88 Q72 80 86 88" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>
  <path d="M114 88 Q128 80 142 88" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>
