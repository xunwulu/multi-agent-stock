  <path d="M52 168 Q34 158 30 142" fill="none" stroke="#2B2B2B" stroke-width="14" stroke-linecap="round"/>
  <path d="M52 168 Q34 158 30 142" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <!-- Cheek blush -->
  <ellipse cx="56" cy="120" rx="7" ry="4" fill="#F2A9A2" opacity="0.8"/>
  <ellipse cx="144" cy="120" rx="7" ry="4" fill="#F2A9A2" opacity="0.8"/>
</svg>