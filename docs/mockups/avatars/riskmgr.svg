  <path d="M52 162 Q100 150 148 162 L152 186 Q100 198 48 186 Z" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="3"/>
  <path d="M60 164 Q70 158 78 164 L80 180 Q68 186 58 180 Z" fill="#2B2B2B"/>
  <path d="M140 164 Q130 158 122 164 L120 180 Q132 186 142 180 Z" fill="#2B2B2B"/>
