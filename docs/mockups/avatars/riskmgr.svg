    <rect x="24" y="120" width="28" height="38" rx="2" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="2"/>
    <rect x="30" y="106" width="16" height="10" rx="3" fill="#8A8A8A" stroke="#2B2B2B" stroke-width="2"/>
    <line x1="28" y1="130" x2="48" y2="130" stroke="#2B2B2B" stroke-width="2"/>
    <line x1="28" y1="138" x2="48" y2="138" stroke="#2B2B2B" stroke-width="2"/>
    <line x1="28" y1="146" x2="42" y2="146" stroke="#2B2B2B" stroke-width="2"/>
  </g>
