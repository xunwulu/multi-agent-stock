    <path d="M42 118 C50 100 74 96 84 110 C92 124 82 142 64 144 C50 140 40 132 42 118 Z" fill="none"/>
    <path d="M158 116 C154 132 142 142 128 146 C114 140 110 122 120 112 C132 100 152 102 158 116 Z" fill="none"/>
  </g>
