<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 分析直播 Demo v8</title>
<style>
:root{--pri:#4ECDC4;--bg:#0d1117;--card:#161b22;--card2:#1a2540;--tx:#e6edf3;--tx2:#8b949e;--bd:#2a3550;--ok:#52c41a;--warn:#faad14;--danger:#ff4444;--bull:#FF4444;--bear:#00C853}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;padding:20px;max-width:1200px;margin:0 auto}
body.drawer-open{overflow:hidden}

/* ===== 顶部作战条 ===== */
.topbar{position:sticky;top:0;z-index:900;background:rgba(13,17,23,.92);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:14px;padding:14px 20px;margin-bottom:14px}
.tb-row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tb-title{font-size:16px;font-weight:700;flex:1;min-width:200px}
.tb-title .code{font-size:12px;color:var(--tx2);margin-left:8px;font-weight:400}
.tb-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tb-time{font-size:12px;color:var(--tx2)}.tb-time b{color:var(--tx);font-variant-numeric:tabular-nums}
.tb-eta{font-size:12px;color:var(--pri)}
.tb-eta.slow{color:var(--warn)}
.tb-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(78,205,196,.12);border:1px solid rgba(78,205,196,.4);color:var(--pri)}
.tbtn{padding:3px 10px;font-size:11px;border-radius:8px;background:var(--card2);border:1px solid var(--bd);color:var(--tx2);cursor:pointer;transition:all .15s}
.tbtn:hover{border-color:var(--pri);color:var(--pri)}
.tbtn.on{background:rgba(78,205,196,.15);border-color:var(--pri);color:var(--pri)}
.tb-steps{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.tstep{flex:1;min-width:96px;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:var(--card2);font-size:11px;color:var(--tx2);cursor:pointer;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tstep .dot2{width:8px;height:8px;border-radius:50%;background:var(--bd);flex-shrink:0}
.tstep.done{color:var(--ok)}.tstep.done .dot2{background:var(--ok)}
.tstep.cur{color:var(--pri);border-color:rgba(78,205,196,.5)}
.tstep.cur .dot2{background:var(--pri);animation:pulse 1.2s infinite}
.tb-sub{font-size:11px;color:var(--tx2);margin-top:8px}
.tb-sub b{color:var(--tx)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

/* ===== 决策卡 ===== */
.dc{background:linear-gradient(135deg,#1a2540,#16213E);border:1px solid var(--bd);border-radius:14px;padding:24px 28px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:12px}
.dc .name{font-size:20px;font-weight:700}.dc .code{font-size:13px;color:var(--tx2);margin-left:8px}
.dc .badge{display:inline-block;background:var(--warn);color:#1a1a2e;font-size:24px;font-weight:800;padding:4px 18px;border-radius:8px;margin-top:8px}
.dc .score{font-size:42px;font-weight:800;color:var(--warn)}.dc .sl{font-size:11px;color:var(--tx2)}
.pr{display:flex;gap:20px;margin-top:10px}.pi{text-align:center}.pi .l{font-size:10px;color:var(--tx2)}.pi .v{font-size:16px;font-weight:700}
.dc-skeleton{align-items:center}
.sk-line{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--card2) 25%,#223050 50%,var(--card2) 75%);background-size:200% 100%;animation:shimmer 1.6s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ===== 降级横幅 ===== */
.degrade-banner{background:#332a12;border:1px solid #6b5a1e;border-radius:10px;padding:10px 16px;margin-bottom:14px;font-size:12px;color:var(--warn);display:none}
.error-banner{background:#2d1a1a;border:1px solid #5a2a2a;border-radius:10px;padding:14px 16px;margin-bottom:14px;font-size:13px;display:none}
.error-banner .et{color:var(--danger);font-weight:700}

/* ===== 阶段区块 ===== */
.stage-sec{margin:26px 0;transition:opacity .4s}
.stage-sec.waiting{opacity:.4}
.ph{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.pn{width:28px;height:28px;border-radius:50%;background:var(--card2);color:var(--tx2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;transition:all .3s}
.stage-sec.running .pn{background:var(--pri);color:var(--bg);animation:pulse 1.2s infinite}
.stage-sec.done .pn{background:var(--ok);color:var(--bg)}
.pt{font-size:15px;font-weight:700}.ps{font-size:11px;color:var(--tx2)}
.ph .st{margin-left:auto}
.st{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.sdone{background:#1a3a2a;color:var(--ok)}.srun{background:#3a3218;color:var(--warn)}.swait{background:var(--card2);color:var(--tx2)}
.swarn{background:#3a3218;color:var(--warn)}
.skip-note{background:var(--card);border:1px dashed var(--bd);border-radius:10px;padding:14px;font-size:12px;color:var(--tx2);text-align:center}

/* ===== 分析师卡 ===== */
.ar{display:flex;gap:14px;flex-wrap:wrap}
.ac{flex:1;min-width:320px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;display:flex;flex-direction:column;transition:border-color .2s}
.ac:hover{border-color:var(--pri)}
.ah{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ah img{width:52px;height:52px;border-radius:50%;border:2px solid var(--bd);flex-shrink:0}
.an{font-size:14px;font-weight:700}.ar2{font-size:11px;color:var(--tx2)}
.sc{font-size:22px;font-weight:800;margin-bottom:8px}
.sc small{font-size:11px;color:var(--tx2);font-weight:400;margin-left:4px}
.sect{font-size:11px;font-weight:700;color:var(--pri);margin:10px 0 6px;display:flex;align-items:center;gap:4px}
.sect::before{content:'';width:3px;height:12px;background:var(--pri);border-radius:2px}
.obs{list-style:none;padding:0}
.obs li{font-size:12px;padding:4px 0 4px 14px;position:relative;line-height:1.5}
.obs li::before{content:'▸';position:absolute;left:0;color:var(--pri)}
.rbar{height:8px;border-radius:4px;background:linear-gradient(90deg,#1a4a2a,#2a3540 50%,#4a1a2a);position:relative;margin:4px 8px 16px}
.rdot{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--tx);border:3px solid var(--bg);box-shadow:0 0 4px rgba(0,0,0,.3);transform:translateX(-50%)}
.rlbl{display:flex;justify-content:space-between;font-size:10px;color:var(--tx2);margin:0 8px}
.rlbl .rv{font-weight:700;color:var(--tx)}.rlbl .rs{color:var(--ok)}.rlbl .rr{color:var(--danger)}
.prow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:11px}
.prow .pl{width:50px;flex-shrink:0;color:var(--tx2);text-align:right}
.pbar{flex:1;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.pfill{height:100%;border-radius:3px}
.prow .pv{color:var(--tx2);font-size:10px;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;background:var(--card2);font-size:11px;border:1px solid var(--bd)}
.chip .cl{color:var(--tx2);font-size:10px}.chip .cv{font-weight:600}
.cv.good{color:var(--ok)}.cv.bad{color:var(--danger)}.cv.warn{color:var(--warn)}
.more{font-size:10px;color:var(--tx2);margin:4px 0;font-style:italic}
.vbtn{display:block;width:100%;margin-top:auto;padding:8px;background:transparent;border:1px solid var(--pri);border-radius:8px;color:var(--pri);font-size:12px;font-weight:600;cursor:pointer;text-align:center;transition:background .2s;flex-shrink:0}
.vbtn:hover{background:rgba(78,205,196,.1)}
.rk .vbtn{padding:5px 8px;font-size:10px;margin-top:8px}
/* 裁决卡（居中判词） */
.vstats{display:flex;justify-content:center;gap:36px;margin:10px 0 14px;flex-wrap:wrap;text-align:center}
.vstats .sc{margin-bottom:2px}
.vsw{font-size:24px;font-weight:800}
.vsl{font-size:10px;color:var(--tx2)}
.vs2{display:flex;gap:10px;margin:6px 0;flex-wrap:wrap}
.vs2>div{flex:1;min-width:220px;border-radius:8px;padding:10px;font-size:12px;line-height:1.6}
.vs-bull{background:#2d1a1a;border:1px solid #5a2a2a;border-left:3px solid #FF4444}
.vs-bear{background:#1a2d1a;border:1px solid #2a5a2a;border-right:3px solid #00C853}
.vst{font-size:11px;font-weight:700;margin-bottom:4px}

/* ===== 卡内心跳日志 ===== */
.hb{margin:2px 0 10px;font-variant-numeric:tabular-nums}
.hb-cur{font-size:13px;font-weight:600;color:var(--tx)}
.hb-cur .spin{display:inline-block;animation:rot 1.2s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.hb-old{font-size:11px;color:var(--tx2);padding-left:2px}
.hb-think{font-size:12px;color:var(--pri);margin-top:4px}
.hb-meta{font-size:10px;color:var(--tx2);margin-top:4px}
.hb-retry{color:var(--warn)}
.sk-fields{margin-top:8px}
.sk-fields .sk-line{margin:8px 0;width:100%}
.sk-fields .sk-line.w40{width:40%}.sk-fields .sk-line.w70{width:70%}

/* ===== 辩论 ===== */
.cn2{display:flex;justify-content:center;padding:6px 0}
.cn2 .ln{width:1px;height:18px;background:var(--bd);position:relative}
.cn2 .ln::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top:6px solid var(--bd)}
.chat{max-width:700px;margin:0 auto}
.bub{max-width:78%;padding:10px 14px;border-radius:14px;margin:6px 0;font-size:12px;line-height:1.5}
.bub-bull{background:#2d1a1a;border:1px solid #5a2a2a;border-bottom-left-radius:4px;margin-right:auto}
.bub-bear{background:#1a2d1a;border:1px solid #2a5a2a;border-bottom-right-radius:4px;margin-left:auto}
.bub .who{font-size:10px;font-weight:700;margin-bottom:3px}
.bub-bull .who{color:#ff6b6b}.bub-bear .who{color:#4ade80}
.bub .bub-txt{white-space:pre-wrap;word-break:break-word}
.bub .bub-txt.clamp{max-height:132px;overflow:hidden;position:relative}
.bub .bub-txt.clamp::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,#161b22 80%)}
.bub-bull .bub-txt.clamp::after{background:linear-gradient(transparent,#2d1a1a 80%)}
.bub-bear .bub-txt.clamp::after{background:linear-gradient(transparent,#1a2d1a 80%)}
.bub .expand{font-size:10px;color:var(--pri);cursor:pointer;user-select:none}
.rtag{text-align:center;font-size:10px;color:var(--tx2);margin:10px 0;background:var(--card);border-radius:10px;padding:2px 12px;display:inline-block}
.rtw{text-align:center}
.brow{display:flex;gap:8px;align-items:flex-start}
.brow.right{justify-content:flex-end}
.brow img{width:32px;height:32px;border-radius:50%;flex-shrink:0}
.ref{display:inline-block;font-size:9px;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.08);color:var(--tx2);margin:0 2px}
.bub-ph{background:var(--card);border:1px dashed var(--bd);color:var(--tx2);font-size:11px}
.brow.ph-bub img{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.75}}
.fade-in{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 风险三方 / 经理卡 / 交易员 ===== */
.rk3{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.rk{flex:1;min-width:180px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center}
.rk img{width:40px;height:40px;border-radius:50%;margin-bottom:4px}
.rk .rn{font-size:11px;font-weight:700;margin-bottom:4px}
.rk .rv{font-size:10px;color:var(--tx2);text-align:left;padding:6px;background:var(--card2);border-radius:6px;line-height:1.5;max-height:96px;overflow:hidden;position:relative}
.rk .rv::after{content:'';position:absolute;bottom:0;left:0;right:0;height:24px;background:linear-gradient(transparent,var(--card2))}
.tc{background:linear-gradient(135deg,#1a2d2a,#162435);border:2px solid var(--pri);border-radius:12px;padding:20px;margin-top:6px}
.th{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.th img{width:64px;height:64px;border-radius:50%;border:2px solid var(--pri)}
.tm{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.mb{background:var(--card);border-radius:8px;padding:8px 12px;text-align:center}
.mb .l{font-size:10px;color:var(--tx2)}.mb .v{font-size:16px;font-weight:700;color:var(--pri)}

/* ===== 抽屉（v7 原样） ===== */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:999}
.dwr{position:fixed;top:0;right:0;width:55%;max-width:700px;height:100vh;background:var(--bg);border-left:1px solid var(--bd);transform:translateX(100%);transition:transform .3s ease;z-index:1000;display:flex;flex-direction:column}
.dwr.open{transform:translateX(0)}.ovl.open{opacity:1;pointer-events:auto}
@media(max-width:768px){.dwr{width:100%}}
.dhd{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--bd);flex-shrink:0}
.dhd img{width:36px;height:36px;border-radius:50%}
.dcls{margin-left:auto;background:none;border:none;color:var(--tx2);font-size:24px;cursor:pointer;padding:4px 12px;border-radius:6px}
.dcls:hover{background:var(--card);color:var(--tx)}
.dtb{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto;scrollbar-width:thin}
.dtb::-webkit-scrollbar{height:4px}.dtb::-webkit-scrollbar-thumb{background:var(--bd)}
.dtab{padding:10px 14px;font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;position:relative}
.dtab.active{color:var(--pri);border-bottom-color:var(--pri)}
.dtab .ready-dot{position:absolute;top:8px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--ok)}
.dbody{flex:1;overflow-y:auto;padding:20px}
.dbody::-webkit-scrollbar{width:6px}.dbody::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.rpt{font-size:13px;line-height:1.8;color:var(--tx)}
.rpt h2{font-size:16px;color:var(--pri);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.rpt h3{font-size:14px;color:var(--pri);margin:12px 0 6px}
.rpt p{margin:6px 0}
.rpt ul{padding-left:20px;margin:6px 0}
.rpt li{margin:3px 0}
.rpt strong{color:var(--pri)}
.rpt table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px}
.rpt th{background:var(--card2);padding:6px 8px;text-align:left;border:1px solid var(--bd);color:var(--tx)}
.rpt td{padding:6px 8px;border:1px solid var(--bd);color:var(--tx2)}
.rpt hr{border:none;border-top:1px solid var(--bd);margin:12px 0}
.rpt .full-text{background:var(--card);border-radius:8px;padding:12px;font-size:12px;line-height:1.8;white-space:pre-wrap;color:var(--tx)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin:10px 0}
.fc{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px}
.fc .fk{font-size:9px;font-weight:700;color:var(--tx2);margin-bottom:2px}
.fc .fv{font-size:12px;font-weight:600;word-break:break-word}
.fv.good{color:var(--ok)}.fv.bad{color:var(--danger)}.fv.warn{color:var(--warn)}
.fc .fs{font-size:10px;color:var(--tx2)}
.fgt{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--pri);margin-top:8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.alist{list-style:none;padding:0;margin:6px 0}
.alist li{font-size:12px;padding:4px 0 4px 14px;position:relative;line-height:1.5;border-bottom:1px solid rgba(255,255,255,.03)}
.alist li::before{content:'▸';position:absolute;left:0;color:var(--pri)}
.err-box{background:#2d1a1a;border:1px solid #5a2a2a;border-radius:10px;padding:16px;margin:20px 0;text-align:center}
.err-box .et{color:var(--danger);font-weight:700;margin-bottom:8px}
.err-box .es{color:var(--tx2);font-size:12px}

/* ===== 回到最新 / toast ===== */
.follow-pill{position:fixed;bottom:24px;right:24px;z-index:901;padding:8px 16px;background:var(--pri);color:#0d1117;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(78,205,196,.35);display:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);z-index:1200;background:var(--card);border:1px solid var(--pri);border-radius:10px;padding:10px 20px;font-size:13px;transition:transform .3s ease}
.toast.show{transform:translateX(-50%) translateY(0)}
.typing-cursor{display:inline-block;width:7px;height:14px;background:var(--tx);vertical-align:-2px;animation:blink .8s step-end infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>

<!-- 顶部作战条 -->
<div class="topbar" id="topbar">
  <div class="tb-row1">
    <div class="tb-title" id="tb-title">🐂 AI 团队正在准备…</div>
    <div class="tb-right">
      <span class="tb-time">⏱ 已用时 <b id="tb-elapsed">00:00</b></span>
      <span class="tb-eta" id="tb-eta"></span>
      <span class="tb-badge" id="tb-demo-badge">演示 · 1x</span>
      <button class="tbtn on" data-speed="1">1x</button>
      <button class="tbtn" data-speed="4">4x</button>
      <button class="tbtn" data-speed="16">16x</button>
      <button class="tbtn" id="btn-skip">跳到结尾</button>
      <button class="tbtn" id="btn-replay">重播</button>
      <button class="tbtn" id="btn-fx">特效 ⚙</button>
    </div>
  </div>
  <div class="tb-steps" id="tb-steps"></div>
  <div class="tb-sub" id="tb-sub">正在连接数据源…</div>
</div>

<!-- 决策卡（骨架 → 阶段6点亮） -->
<div class="dc dc-skeleton" id="decision-card"></div>
<div class="degrade-banner" id="degrade-banner"></div>
<div class="error-banner" id="error-banner"></div>

<!-- 六阶段 -->
<section class="stage-sec waiting" id="sec-1">
  <div class="ph"><div class="pn">1</div><div><div class="pt">三路侦察</div><div class="ps">技术 / 基本面 / 新闻 并行分析</div></div><span class="st swait">待命</span></div>
  <div class="ar" id="analysts-row"></div>
</section>
<section class="stage-sec waiting" id="sec-2">
  <div class="ph"><div class="pn">2</div><div><div class="pt">多空对决</div><div class="ps">看多 vs 看空 · 2 轮对抗</div></div><span class="st swait">待命</span></div>
  <div class="chat" id="debate-view"></div>
</section>
<section class="stage-sec waiting" id="sec-3">
  <div class="ph"><div class="pn">3</div><div><div class="pt">经理裁决</div><div class="ps">研究经理评判辩论胜负</div></div><span class="st swait">待命</span></div>
  <div class="ar"><div class="ac" style="max-width:680px;margin:0 auto" id="rm-card"></div></div>
</section>
<section class="stage-sec waiting" id="sec-4">
  <div class="ph"><div class="pn">4</div><div><div class="pt">风险听证</div><div class="ps">激进 / 保守 / 中性 三方质证</div></div><span class="st swait">待命</span></div>
  <div class="rk3" id="risk3"></div>
</section>
<section class="stage-sec waiting" id="sec-5">
  <div class="ph"><div class="pn">5</div><div><div class="pt">风险裁决</div><div class="ps">风险经理综合定级</div></div><span class="st swait">待命</span></div>
  <div class="ar"><div class="ac" style="max-width:680px;margin:0 auto" id="riskmgr-card"></div></div>

function fieldGridAuto(json, groups) {
  const keys = Object.keys(json);
  let h = '<div class="fg">';
  const grouped = {};
  for (const k of keys) {
    const v = json[k];
    if (v===null||v===undefined||v==='') continue;
    let found = false;
    if (groups) {
      for (const [gname, pattern] of Object.entries(groups)) {
        if (pattern.test(k)) { (grouped[gname]=grouped[gname]||[]).push([k,v]); found=true; break; }
      }
    }
    if (!found) (grouped['其他']=grouped['其他']||[]).push([k,v]);
  }
  for (const [gname, fields] of Object.entries(grouped)) {
    h += `<div class="fgt">${gname}</div>`;
    for (const [k,v] of fields) {
      if (Array.isArray(v)) {
        h += `<div style="grid-column:1/-1" class="fc"><div class="fk">${kcn(k)}</div><ul class="alist">`;
        v.slice(0,5).forEach(item => {
          const txt = typeof item==='object' ? (item.event||item.title||item.condition||JSON.stringify(item).slice(0,80)) : cn(item);
          h += `<li>${esc(String(txt))}</li>`;
        });
        if (v.length>5) h += `<li style="color:var(--tx2)">… 共 ${v.length} 条</li>`;
        h += '</ul></div>';
      } else if (typeof v==='object') {
        for (const [sk,sv] of Object.entries(v)) {
          const fv2 = fmt(sv);
          if (fv2===null && typeof sv==='object') {
            h += `<div class="fc"><div class="fk">${kcn(k)}·${kcn(sk)}</div><div class="fs">${esc(JSON.stringify(sv).slice(0,80))}…</div></div>`;
          } else if (fv2!==null) {
            h += `<div class="fc"><div class="fk">${kcn(k)}·${kcn(sk)}</div><div class="fv ${colorFor(sk,sv)}">${esc(typeof sv==='string'?cn(fv2):fv2)}</div></div>`;
          }
        }
      } else if (typeof v==='string' && v.length>120){
        h += `<div class="fc" style="grid-column:1/-1"><div class="fk">${kcn(k)}</div><div class="full-text">${esc(cn(v))}</div></div>`;
      } else {
        h += `<div class="fc"><div class="fk">${kcn(k)}</div><div class="fv ${colorFor(k,v)}">${esc(typeof v==='string'?cn(fmt(v)):fmt(v))}</div></div>`;
      }
    }
  }
  return h + '</div>';
}
function md(src) {
  if (!src) return '<p style="color:var(--tx2)">（无内容）</p>';
  let lines = src.split('\n');
  let h = [], inList = false, inTable = false;
  for (let line of lines) {
    let trimmed = line.trim();
    if (!trimmed) { if(inList){h.push('</ul>');inList=false;} if(inTable){h.push('</table>');inTable=false;} continue; }
    if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
      const cells = trimmed.slice(1,-1).split('|').map(c=>c.trim());
      if (cells.every(c=>/^[-: ]+$/.test(c))) continue;
      if (!inTable) { h.push('<table>'); inTable=true; }
      h.push('<tr>' + cells.map(c=>`<td>${c.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}</td>`).join('') + '</tr>');
      continue;
    } else if (inTable) { h.push('</table>'); inTable=false; }
    let m = trimmed.match(/^(#{1,4})\s+(.+)$/);
    if (m) {
      if(inList){h.push('</ul>');inList=false;}
      const lv = m[1].length;
      const tag = lv<=2?'h2':lv===3?'h3':'h4';
      h.push(`<${tag}>${m[2].replace(/\*\*/g,'')}</${tag}>`);
      continue;
    }
    if (/^---+$/.test(trimmed)) { h.push('<hr>'); continue; }
    m = trimmed.match(/^[-*]\s+(.+)$/) || trimmed.match(/^\d+\.\s+(.+)$/);
    if (m) {
      if(!inList){h.push('<ul>');inList=true;}
      h.push(`<li>${m[1].replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}</li>`);
      continue;
    }
    if(inList){h.push('</ul>');inList=false;}
    h.push(`<p>${esc(trimmed).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}</p>`);
  }
  if(inList)h.push('</ul>'); if(inTable)h.push('</table>');
  return h.join('');
}

    this.lastWall = performance.now();
    this._reduce(ev);
    this.emit(ev);
    return true;
  },

  _reduce(ev){
    const d = ev.data||{};
    switch(ev.type){
      case 'run_started':
        D.meta = Object.assign({}, D.meta, {stock_code:d.stock_code, stock_name:d.stock_name});
        this.plan = d.plan||null;
        break;
      case 'stage_started':
        this.stage[ev.stage] = {state:'run', startTs:ev.ts, label:d.label||''};
        break;
      case 'stage_done':
        if (this.stage[ev.stage]) { this.stage[ev.stage].state = d.skipped?'skipped':'done'; this.stage[ev.stage].doneTs = ev.ts; this.stage[ev.stage].skipped = !!d.skipped; }
        if (ev.stage===2 && d.result) D.debate = d.result;
        if (ev.stage===4 && d.result) D.risk = d.result;
        break;
      case 'agent_heartbeat': {
        const a = ev.agent; if (!a) break;
        const info = this.agentInfo[a] = this.agentInfo[a] || {status:'run', hb:[]};
        info.status = info.status==='done' ? 'done' : 'run';
        info.hb.push({ts:ev.ts, iteration:d.iteration, tool:d.tool, tool_status:d.tool_status,
                      duration_ms:d.duration_ms, elapsed_ms:d.elapsed_ms, retry_note:d.retry_note});
        if (info.hb.length>4) info.hb = info.hb.slice(-4);
        break;
      }
      case 'agent_done': {
        const a = ev.agent; if (!a) break;
        const info = this.agentInfo[a] = this.agentInfo[a] || {hb:[]};
        info.status='done'; info.doneTs=ev.ts; info.duration_ms=d.duration_ms;
        info.error_type=d.error_type||null; info.tool_calls=d.tool_calls; info.iterations=d.iterations;
        if (a==='tech'||a==='fund'||a==='news') D[a] = {content:d.content, json:d.json};
        else if (a==='rm') { this.rmJson = d.json; this.rmContent = d.content||null; D.combined = Object.assign({}, this.rmJson, this.riskmgrJson||{}); }
        else if (a==='riskmgr') { this.riskmgrJson = d.json; this.riskmgrContent = d.content||null; D.combined = Object.assign({}, this.rmJson||{}, this.riskmgrJson); }
        else if (a==='trader') D.trader = d.json;
        break;
      }
      case 'speech_done': {
        const arr = (ev.stage===2 ? this.liveRounds.debate : this.liveRounds.risk);
        let r = arr.find(x=>x.round===d.round);
        if (!r) { r = {round:d.round}; arr.push(r); arr.sort((x,y)=>x.round-y.round); }
        r[d.role] = {content:d.content, duration_ms:d.duration_ms};
        break;
      }
      case 'run_done':
        D = d.result || D;         // 终态为真相（契约：深度等于 result_data.json）
        this.runStatus = 'done';
        break;
      case 'run_error':
        this.runStatus = 'error';
        break;
    }
  },

  /* 派生量 */
  stageState(id){ return (this.stage[id]||{}).state || 'wait'; },
  analystsDone(){ return ANALYSTS.filter(a=>(this.agentInfo[a.id]||{}).status==='done').length; },
  speechCount(stage){ return this.events.filter(e=>e.type==='speech_done'&&e.stage===stage).length; },
  combinedNow(){ return Object.assign({}, this.rmJson||{}, this.riskmgrJson||{}); },
};

/* ===== 虚拟时钟：事件时间为真，间隙按倍速推进 ===== */
const Clock = {
  now(){ return Store.lastTs + (performance.now()-Store.lastWall)*Store.speed; },
};

/* =====================================================================
 * 数据源（同一 emit 接口，渲染层不感知来源）
 * ===================================================================== */
function makeReplaySource(url){
  return {
    mode:'mock', idx:0, events:[], timer:null, done:false,
    async start(onEvent, onEnd){
      const res = await fetch(url); if(!res.ok) throw new Error(`HTTP ${res.status} @ ${url}`);
      const text = await res.text();
      this.events = text.trim().split('\n').map(l=>JSON.parse(l));
      this.idx = 0; this.done=false;
      this._onEvent = onEvent; this._onEnd = onEnd;
      this._schedule(300);
    },
    _schedule(gapMs){
      clearTimeout(this.timer);
      this.timer = setTimeout(()=>this._next(), Math.max(0, gapMs/Store.speed));
    },
    _next(){
      if (this.idx >= this.events.length){ this._finish(); return; }
      const ev = this.events[this.idx++];
      this._onEvent(ev);
      if (this.idx >= this.events.length){ this._finish(); return; }
      const gap = this.events[this.idx].ts - ev.ts;
      persistProgress(this.idx, this.done);
      this._schedule(gap);
    },
    _finish(){
      if (this.done) return;
      this.done = true; persistProgress(this.idx, true);
      clearTimeout(this.timer);
      if (this._onEnd) this._onEnd();
    },
    setSpeed(){ if (this.timer && this.idx < this.events.length){ clearTimeout(this.timer); this._schedule(200); } },
    skip(){ while (this.idx < this.events.length){ const ev=this.events[this.idx++]; this._onEvent(ev); } this._finish(); },
  };
}

function makePollingSource(url){
  return {
    mode:'live', lastSeq:0, timer:null, backoff:0, stopped:false,
    async start(onEvent, onEnd){
      this._onEvent = onEvent; this._onEnd = onEnd;
      document.getElementById('tb-demo-badge').textContent = '实时模式';
      this._poll = async () => {
        if (this.stopped) return;
        try{
          const res = await fetch(url + (url.includes('?')?'&':'?') + '_=' + Date.now());
          if(!res.ok) throw new Error(`HTTP ${res.status}`);
          const snap = await res.json();
          this.backoff = 0;
          for (const ev of (snap.events||[])){
            if (ev.seq > this.lastSeq){ this.lastSeq = ev.seq; onEvent(ev); }
          }
          if (snap.status==='done' || snap.status==='error'){ this.stopped=true; if(this._onEnd) this._onEnd(); return; }
        }catch(e){ /* 退避重试，下轮快照天然自愈 */ }
        const delays=[2000,2000,5000,10000];
        this.timer = setTimeout(this._poll, delays[Math.min(this.backoff++, delays.length-1)]);
      };
      this._poll();
    },
    setSpeed(){}, skip(){},
  };
}

/* ===== F5 恢复（mock 模式：localStorage 记进度，重放事件恢复现场） ===== */
const LS_KEY = 'v8_mock_progress';
function persistProgress(idx, done){
  if (Source.mode!=='mock' || Source._isReplay) return;
  try{ localStorage.setItem(LS_KEY, JSON.stringify({url: currentEventsUrl(), idx, done, t: Date.now()})); }catch(e){}
}
function readPersisted(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){ return null; } }
function clearPersisted(){ try{ localStorage.removeItem(LS_KEY); }catch(e){} }
function currentEventsUrl(){
  const p = new URLSearchParams(location.search);
  const fixture = p.get('fixture')==='degraded' ? 'degraded' : 'base';
  return fixture==='degraded' ? 'events_demo_degraded.jsonl' : 'events_demo.jsonl';
}

/* =====================================================================
 * 渲染层
 * ===================================================================== */
const $ = id => document.getElementById(id);
function toast(msg, ms=4000){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), ms);
}
function fmtDur(ms){ const s=Math.max(0,Math.round(ms/1000)); return s<60?`${s}秒`:(s<3600?`${Math.floor(s/60)}分${s%60?((s%60)+'秒'):''}`:`${Math.floor(s/3600)}时${Math.floor(s%3600/60)}分`); }
function fmtClock(ms){ const s=Math.max(0,Math.floor(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function countUpMaybe(el, val){
  if (!FX.countup || typeof val!=='number' || !isFinite(val)){ el.textContent = val; return; }
  const t0=performance.now(), dur=600, from=0;
  (function step(t){ const p=Math.min(1,(t-t0)/dur); el.textContent=(from+(val-from)*p).toFixed(val%1?1:0); if(p<1) requestAnimationFrame(step); })(t0);
}

function renderEta(){
  const el=$('tb-eta'); if(!Store.plan || Store.runStatus!=='running'&&Store.runStatus!=='done'){ el.textContent=''; return; }
  if (Store.runStatus==='done'){ el.textContent=''; el.className='tb-eta'; return; }
  // 已完成阶段用实际耗时，未完成阶段用预估区间
  let lo=0, hi=0, elapsed=Clock.now()-Store.startTs;
  for (const p of Store.plan){
    const st=Store.stageState(p.stage);
    if (st==='done'||st==='skipped'){ /* 实际耗时不计入剩余 */ }
    else if (st==='run'){ lo+=p.est_ms_range[0]*1000*0.2; hi+=p.est_ms_range[1]*1000; }
    else { lo+=p.est_ms_range[0]*1000; hi+=p.est_ms_range[1]*1000; }
  }
  const hiAll=Store.plan.reduce((a,p)=>a+p.est_ms_range[1]*1000,0);
  Store.slow = elapsed > hiAll;
  if (Store.slow){ el.textContent='比预期慢，仍在正常运行…'; el.className='tb-eta slow'; }
  else { el.textContent=`预计还需 ${lo>0?fmtEta(lo):'不到半分钟'} ~ ${fmtEta(hi)}`; el.className='tb-eta'; }
}
function fmtEta(ms){ const m=ms/60000; return m<1?'半分钟':(m<10?(Math.round(m*2)/2+' 分钟'):(Math.round(m)+' 分钟')); }

function expandBubble(span){
  const bub=span.closest('.bub'), txt=bub.querySelector('.bub-txt');
  if (txt.classList.contains('clamp')){ txt.classList.remove('clamp'); span.textContent='收起'; }
  else { txt.classList.add('clamp'); span.textContent='展开全文'; }
}
function typewrite(bub, full){
  const txt=bub.querySelector('.bub-txt');
  const plain=full, total=Math.min(4000, Math.max(1200, full.length*8));
  const step=Math.max(4, Math.ceil(full.length/(total/30)));
  let i=0; bub._twDone=false;
  txt.innerHTML='<span class="typing-cursor"></span>';
  const iv=setInterval(()=>{
    if (bub._twDone){ clearInterval(iv); return; }
    i=Math.min(plain.length, i+step);
    txt.innerHTML=esc(plain.slice(0,i))+'<span class="typing-cursor"></span>';
    if(i>=plain.length){ clearInterval(iv); txt.innerHTML=refs(esc(plain)); if(plain.length>300) txt.classList.add('clamp'); }
  },30);
  bub.onclick=()=>{ if(!bub._twDone){ bub._twDone=true; txt.innerHTML=refs(esc(plain)); if(plain.length>300) txt.classList.add('clamp'); } };
}

/* =====================================================================
 * FollowController：自动跟随 / 上滑暂停 / 回到最新
 * ===================================================================== */
const Follow = {
  following:true, missed:0,
  init(){
    window.addEventListener('scroll',()=>{
      const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 140;
      if (!this.following && nearBottom) this.resume(false);
      else if (this.following && !nearBottom && this._expectScroll) { /* 程序滚动中 */ }
    }, {passive:true});
    let lastY=window.scrollY;
    window.addEventListener('scroll',()=>{
      if (window.scrollY < lastY - 30 && this.following) this.pause();
      lastY=window.scrollY;
    }, {passive:true});
    $('follow-pill').onclick=()=>this.resume(true);
  },
  to(el){ if(!this.following||!el) return; this._expectScroll=true;
    el.scrollIntoView({behavior:'smooth',block:'end'});
    setTimeout(()=>{this._expectScroll=false;},600); },
  pause(){ this.following=false; $('follow-pill').style.display='block'; },
  resume(scroll){ this.following=true; this.missed=0; $('follow-pill').style.display='none';
    if(scroll!==false) window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); },
  bump(){ if(!this.following){ this.missed++; $('follow-pill').textContent=`↓ 回到最新（${this.missed}）`; } },
};
function markNew(el){ Follow.bump(); Follow.to(el); }
function scrollToStage(id){ const el=$('sec-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

        const blk=D[tab]||{};
        if(!blk.json) return pendingBox(`${TABS[tab].title}分析师分析中`,1);
        return `<h2>${TABS[tab].title}报告</h2><h3>分析推理</h3><div class="full-text">${blk.content||'（无）'}</div><h3>全部 ${Object.keys(blk.json).length} 字段</h3>${fieldGridAuto(blk.json,GROUPS[tab])}`;
      }
      case 'news':{
        const blk=D.news||{};
        if(!blk.json) return pendingBox('新闻面分析师分析中',1);
        return `<h2>新闻面报告</h2><h3>完整报告（markdown）</h3>${md(blk.content)}<h3>全部 ${Object.keys(blk.json).length} 字段</h3>${fieldGridAuto(blk.json,GROUPS.news)}`;
      }
      case 'debate':{
        const rounds=(D.debate&&D.debate.rounds)||Store.liveRounds.debate;
        if(!rounds.length) return pendingBox('多空对决尚未开始',2);
        let h='<h2>多空辩论</h2>';
        for(const r of rounds){ h+=`<h3>第 ${r.round} 轮</h3>`;
          if(r.bull)h+=`<div style="background:#2d1a1a;border-radius:8px;padding:12px;margin:6px 0;border-left:3px solid #FF4444"><b style="color:#ff6b6b">🐂 看多</b><br>${refs(r.bull.content||'')}</div>`;
          if(r.bear)h+=`<div style="background:#1a2d1a;border-radius:8px;padding:12px;margin:6px 0;border-left:3px solid #00C853"><b style="color:#4ade80">🐻 看空</b><br>${refs(r.bear.content||'')}</div>`; }
        return h;
      }
      case 'manager':{
        const {rm}=splitCombined();
        if(!Store.rmJson && !Object.keys(rm).length) return pendingBox('经理研判尚未生成',3);
        let h=`<h2>研究经理裁决</h2>`;
        if(Store.rmContent) h+=`<h3>分析推理</h3><div class="full-text">${esc(Store.rmContent)}</div>`;
        if(rm.debate_rationale) h+=`<h3>评判理由</h3><div class="full-text">${esc(rm.debate_rationale)}</div>`;
        if(rm.strongest_bull_point) h+=`<div style="background:#2d1a1a;border-radius:8px;padding:10px;margin:6px 0;border-left:3px solid #FF4444"><b style="color:#ff6b6b">🐂 看多最强论点</b><br>${esc(rm.strongest_bull_point)}</div>`;
        if(rm.strongest_bear_point) h+=`<div style="background:#1a2d1a;border-radius:8px;padding:10px;margin:6px 0;border-left:3px solid #00C853"><b style="color:#4ade80">🐻 看空最强论点</b><br>${esc(rm.strongest_bear_point)}</div>`;
        if(rm.recommendation) h+=`<h3>投资建议</h3><div class="full-text">${esc(rm.recommendation)}</div>`;
        if(Array.isArray(rm.risk_warnings)&&rm.risk_warnings.length) h+=`<h3>风险提示</h3><ul class="alist">${rm.risk_warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`;
        h+=`<h3>全部 ${Object.keys(rm).length} 字段</h3>${fieldGridAuto(rm,GROUPS.rm)}`;
        return h;
      }
      case 'risk':{
        const {rsk}=splitCombined();
        const r=((D.risk&&D.risk.rounds)||Store.liveRounds.risk)[0]||{};
        if(!Object.keys(rsk).length && !r.aggressive && !r.conservative && !r.neutral) return pendingBox('风险听证尚未开始',4);
        let h=`<h2 id="riskmgr-anchor">风险裁决</h2>`;
        if(Object.keys(rsk).length){
          h+=`<div style="display:flex;gap:24px;margin:8px 0;flex-wrap:wrap">
            <div><div style="font-size:22px;font-weight:800;color:var(--danger)">${cn(rsk.risk_level)||'-'}</div><div style="font-size:10px;color:var(--tx2)">风险等级</div></div>
            <div><div style="font-size:22px;font-weight:800">${rsk.risk_score??'-'}</div><div style="font-size:10px;color:var(--tx2)">风险评分</div></div>
            <div><div style="font-size:22px;font-weight:800">${rsk.risk_winner?cn(rsk.risk_winner)+'胜':'-'}</div><div style="font-size:10px;color:var(--tx2)">听证胜方</div></div>
          </div>`;
          if(Store.riskmgrContent) h+=`<h3>分析推理</h3><div class="full-text">${esc(Store.riskmgrContent)}</div>`;
          h+=fieldGridAuto(rsk,GROUPS.riskVerdict);
        } else h+=pendingBox('风险经理尚未裁决',5);
        h+=`<h2>三方质证全文</h2>`;
        if(r.aggressive)h+=`<h3 id="rk-anchor-aggressive">🔥 激进方</h3><div style="background:#2d1a1a;border-radius:8px;padding:10px">${refs(r.aggressive.content||'')}</div>`;
        if(r.conservative)h+=`<h3 id="rk-anchor-conservative">🛡 保守方</h3><div style="background:#1a2d1a;border-radius:8px;padding:10px">${refs(r.conservative.content||'')}</div>`;
        if(r.neutral)h+=`<h3 id="rk-anchor-neutral">⚖ 中性方</h3><div style="background:var(--card);border-radius:8px;padding:10px">${refs(r.neutral.content||'')}</div>`;
        return h;
      }
      case 'trader':{
        const t=D.trader;
        if(!t) return pendingBox('交易员尚未拍板',6);
        let h=`<h2>交易决策</h2>${fieldGridAuto(t,{ '决策':/action|strength/, '价格':/price|loss|profit/, '置信':/confidence/, '风险与仓位':/risk|position/, '时间':/time|horizon/, '理由':/rationale|reason|summary/ })}`;
        if(t.confidence_components){h+='<h3>置信度 5 维</h3>';const labels={signal_consistency:'信号一致',data_sufficiency:'数据充分',debate_certainty:'辩论确定',risk_controllability:'风控可控',valuation_reasonableness:'估值合理'};const colors=['#4C6EF5','#2F9E44','#F59F00','#E8590C','#9C36B5'];let i=0;for(const[k,v]of Object.entries(t.confidence_components)){h+=`<div class="prow"><span class="pl">${labels[k]||k}</span><div class="pbar"><div class="pfill" style="width:${v/20*100}%;background:${colors[i%colors.length]}"></div></div><span class="pv">${v}/20</span></div>`;i++;}}
        return h;
      }
    }
  }catch(e){return `<div class="err-box"><div class="et">渲染出错</div><div class="es">${e.message}</div></div>`;}
  return '';
}

/* =====================================================================
 * 主渲染分发（Store 订阅）
 * ===================================================================== */
Store.on(ev=>{
  const d=ev.data||{};
  switch(ev.type){
    case 'run_started':
      renderTopbar(); break;
    case 'stage_started':
      setSectionState(ev.stage,'run');
      if (ev.stage===1) renderAnalystsInit();
      if (ev.stage===2){ renderDebateInit(); debatePlaceholder(); }
      if (ev.stage===3) renderMgrRun('rm-card','avatars/rm.svg','研究经理','评判辩论胜负');
      if (ev.stage===4) renderRiskInit();
      if (ev.stage===5) renderMgrRun('riskmgr-card','avatars/riskmgr.svg','风险经理','综合风险评估');
      if (ev.stage===6) renderTraderRun();
      renderTopbar(); break;
    case 'agent_heartbeat':
      if (ev.stage===1) renderHeartbeat(ev.agent);
      break;
    case 'agent_done':
      if (ev.stage===1) renderAnalystDone(ev.agent);
      else if (ev.agent==='rm') renderRM();
      else if (ev.agent==='riskmgr') renderRiskMgr();
      else if (ev.agent==='trader'){ renderTrader(); renderDecision(); }
      renderTopbar(); break;
    case 'speech_done':
      appendSpeech(ev.stage, d); renderTopbar(); break;
    case 'stage_done':
      if (d.skipped){ setSectionState(ev.stage,'skipped'); renderSkip(ev.stage,d.reason); }
      else setSectionState(ev.stage,'done');
      if (ev.stage===1){ ANALYSTS.forEach(a=>{ if((Store.agentInfo[a.id]||{}).status!=='done') renderAnalystDone(a.id); }); }
      if (ev.stage===2){ const el=$('ph-bub'); if(el) el.remove(); }
      renderTopbar(); break;
    case 'run_done':
      setSectionState(6,'done'); renderTopbar(); renderDecision(); renderTrader(); renderBanners();
      assertContract();
      toast('✓ 分析完成'); clearPersisted();
      setTimeout(()=>Follow.resume(true),600);
      { const q=new URLSearchParams(location.search), po=q.get('open');
        if (po && TAB_ORDER.indexOf(po)>=0) setTimeout(()=>openDrawer(po, q.get('anchor')||undefined), 900); }
      break;
    case 'run_error':
      renderTopbar(); renderBanners(); break;
  }
});

/* ===== 契约对账（run_done 后：重放终态深度==result_data.json） ===== */
function deepEqual(a,b){ if(a===b) return true;
  if(typeof a!=='object'||typeof b!=='object'||a===null||b===null) return false;
  if(Array.isArray(a)!==Array.isArray(b)) return false;
  const ka=Object.keys(a),kb=Object.keys(b);
  if(ka.length!==kb.length) return false;
  return ka.every(k=>deepEqual(a[k],b[k]));
}
async function assertContract(){
  if (Source.mode!=='mock' || currentEventsUrl().indexOf('degraded')>=0) return;
  try{
    const res=await fetch('result_data.json'); if(!res.ok) return;
    const expected=await res.json();
    if (deepEqual(D, expected)) console.info('%c[契约对账] 重放终态 深度==result_data.json ✓','color:#52c41a;font-weight:bold');
    else { console.error('[契约对账] 重放终态与 result_data.json 不一致！', {replay:D, expected}); }
  }catch(e){ console.warn('[契约对账] 跳过（result_data.json 拉取失败）', e.message); }
}

function resetAll(){
  closeDrawer();
  Store.seqs.clear(); Store.events=[]; Store.stage={}; Store.agentInfo={};
  Store.rmJson=null; Store.riskmgrJson=null; Store.rmContent=null; Store.riskmgrContent=null; Store.liveRounds={debate:[],risk:[]};
  Store.plan=null; Store.startTs=null; Store.lastTs=0; Store.runStatus='running'; Store.slow=false;
  D={meta:{}};
  document.title='AI 分析直播 Demo v8';
  $('error-banner').style.display='none'; $('degrade-banner').style.display='none';
  STAGES.forEach(s=>setSectionState(s.id,'wait'));
  renderDecisionSkeleton(); renderAnalystsInit(); renderDebateInit(); renderRiskInit();
  $('rm-card').innerHTML=mgrSkeleton('rm-card','avatars/rm.svg','研究经理');
  $('riskmgr-card').innerHTML=mgrSkeleton('riskmgr-card','avatars/riskmgr.svg','风险经理');
  $('trader-card').innerHTML=mgrSkeleton('trader-card','avatars/trader.svg','交易员');
  $('tb-demo-badge').textContent=`演示 · ${Store.speed}x`;
  renderTopbar();
}
async function restart(){
  clearPersisted();
  if (Source && Source.timer) clearTimeout(Source.timer);
  resetAll();
  Follow.resume(false); window.scrollTo({top:0});
  await startSource();
}

/* =====================================================================
 * 启动
 * ===================================================================== */
let Source=null;
async function startSource(recoverIdx){
  const p=new URLSearchParams(location.search);
  const replayUrl = p.get('replay');
  Store.runStatus='running';
  // 回放模式: ?replay=<progress.jsonl地址> —— 历史存档带动画重演（倍速/跳过可用）
  if (replayUrl){
    clearPersisted();
    Source = makeReplaySource(replayUrl);
    Source._isReplay = true;
    await Source.start(ev=>Store.apply(ev), ()=>{});
    return;
  }
  const sourceMode = p.get('source')==='live' ? 'live' : 'mock';
  if (sourceMode==='mock'){
    Source = makeReplaySource(currentEventsUrl());
    if (recoverIdx>0){
      // F5 恢复：无动画直出已到达进度，然后继续直播
      const res=await fetch(currentEventsUrl()); const text=await res.text();
      const evs=text.trim().split('\n').map(l=>JSON.parse(l));
      evs.slice(0,recoverIdx).forEach(ev=>Store.apply(ev));
      toast(`欢迎回来，已进行到${(()=>{
        const cur=STAGES.find(x=>Store.stageState(x.id)==='run');
        return cur?`第${cur.id}阶段（${cur.label}）`:'';

      })()||'结尾'}`);
      Source.events=evs; Source.idx=recoverIdx; Source.done=false;
      await new Promise(r=>setTimeout(r,900));
      Source._onEvent=ev=>Store.apply(ev); Source._onEnd=()=>{};
      Source._schedule(300);
    } else {
      await Source.start(ev=>Store.apply(ev), ()=>{});
    }
  } else {
    const url=p.get('url')||'progress_demo.json';
    Source = makePollingSource(url);
    await Source.start(ev=>Store.apply(ev), ()=>{});
  }
}

(async function boot(){
  renderTopbarInit(); Follow.init();
  renderDecisionSkeleton(); renderAnalystsInit();
  $('rm-card').innerHTML=mgrSkeleton('rm-card','avatars/rm.svg','研究经理');
  $('riskmgr-card').innerHTML=mgrSkeleton('riskmgr-card','avatars/riskmgr.svg','风险经理');
  $('trader-card').innerHTML=mgrSkeleton('trader-card','avatars/trader.svg','交易员');
  resetAll();
  try{
    const saved=readPersisted();
    if (saved && !new URLSearchParams(location.search).get('replay')
        && saved.url===currentEventsUrl() && saved.idx>0 && !saved.done){
      await startSource(saved.idx);       // 恢复现场并继续
    } else {
      clearPersisted();
      await startSource();
    }
  }catch(e){
    document.body.insertAdjacentHTML('afterbegin',`<div class="err-box"><div class="et">数据加载失败</div><div class="es">${esc(e.message)}</div><div class="es" style="margin-top:8px">请用 Live Server 或 python -m http.server 打开，不要直接双击 HTML 文件。</div></div>`);
  }
})();
</script>
